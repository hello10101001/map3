plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.dronegcs.app'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.dronegcs.app'
        minSdk 24          // Android 7.0 이상
        targetSdk 34
        // GitHub에서 빌드할 때마다 번호가 1씩 올라감 (설치된 앱 위에 업데이트로 설치됨)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // 항상 같은 키로 서명 → 새로 빌드한 APK를 기존 앱을 지우지 않고 덮어 설치할 수 있음 (태블릿에 저장된 임무 기록 유지)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // 웹 앱(web/ 폴더)을 그대로 앱에 넣음 — 웹 파일을 한 곳에서만 관리
    sourceSets {
        main {
            assets.srcDirs = ['../web']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'   // WebViewAssetLoader: 앱 안 파일을 https 주소로 열기 (위치 권한에 필요)
    implementation 'androidx.annotation:annotation:1.8.0'   // USB 시리얼 코드(com/hoho, usb-serial-for-android 3.8.1 소스 포함, MIT)가 씀
}
