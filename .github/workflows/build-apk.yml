name: APK 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        run: |
          # 파일을 저장소 맨 위에 올렸든, drone-gcs 폴더째 올렸든 둘 다 빌드되게 함
          if [ -f gradlew ]; then :; elif [ -f drone-gcs/gradlew ]; then cd drone-gcs; else echo "gradlew 파일을 찾을 수 없습니다. app, web, gradlew 가 보이게 올렸는지 확인하세요."; exit 1; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: drone-gcs-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
